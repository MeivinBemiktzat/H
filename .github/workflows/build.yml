name: Build AI-Local APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the APK under (e.g. v1.0.0)"
        required: false
        default: "build"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper jar
        # The wrapper launcher script (gradlew) is committed, but the binary
        # gradle-wrapper.jar it calls is not (it can't be authored by hand).
        # This regenerates it from the pinned version in
        # gradle/wrapper/gradle-wrapper.properties before first use.
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.AILOCAL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write keystore.properties
        run: |
          if [ -f release.keystore ]; then
            cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=${{ secrets.AILOCAL_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.AILOCAL_KEY_ALIAS }}
          keyPassword=${{ secrets.AILOCAL_KEY_PASSWORD }}
          EOF
            echo "Using provided release signing secrets."
          else
            echo "No release keystore secret found - generating a local debug-style keystore so the build still produces a signed, installable APK."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias ailocal \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "ailocal_generated" -keypass "ailocal_generated" \
              -dname "CN=AI Local, OU=Local Build, O=AI Local, L=, S=, C=IL"
            cat > keystore.properties << EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=ailocal_generated
          keyAlias=ailocal
          keyPassword=ailocal_generated
          EOF
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Verify APK is signed and zip-aligned
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "${{ steps.locate_apk.outputs.apk_path }}"
          "$BUILD_TOOLS/zipalign" -c -v 4 "${{ steps.locate_apk.outputs.apk_path }}"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp "${{ steps.locate_apk.outputs.apk_path }}" dist/AI-Local.apk

      - name: Build README for package
        run: |
          mkdir -p package/AI-Local
          cp dist/AI-Local.apk package/AI-Local/AI-Local.apk
          cp README.txt package/AI-Local/README.txt

      - name: Create AI-Local.zip
        run: |
          cd package
          zip -r ../AI-Local.zip AI-Local
          cd ..

      - name: Create AI-Local-Source.zip
        run: |
          git archive --format=zip --output=AI-Local-Source.zip HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Local-build
          path: |
            dist/AI-Local.apk
            AI-Local.zip
            AI-Local-Source.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "AI-Local ${{ github.event.inputs.release_tag }}"
          files: |
            dist/AI-Local.apk
            AI-Local.zip
            AI-Local-Source.zip
          draft: false
          prerelease: false
